services:
  postgres:
    image: postgres:17-alpine
    container_name: cue-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cue}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cue}
      POSTGRES_DB: ${POSTGRES_DB:-cue}
    ports:
      - '${POSTGRES_PORT:-5434}:5432'
    volumes:
      - cue-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  cue-pgdata:
