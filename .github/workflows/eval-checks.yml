# Runs on every pull request: generates the smoke subset's lines with the
# production prompt and scores them with the DETERMINISTIC checks only
# (`pnpm eval checks`): at most 20 words, one line, no preamble, no
# placeholders, no banned phrases. No LLM judge, so it spends none of the
# judge's daily token quota and can't fail because the judge was rate limited.
# Quality (the judged smoke run) is a manual workflow: eval-smoke.yml.
#
# Needs the repository secret GROQ_API_KEY for the model under test. Pull
# requests from forks don't get secrets, so for them the step is skipped with a
# warning (never use pull_request_target: it would hand the key to untrusted code).
#
# Threshold: the repository variable EVAL_MIN_CHECKS_PASS_RATE, default 0.70.
# Calibrated 2026-11-20 for the production prompt suggest-v2 with real runs of
# this exact command: 24 of 24 lines passed (twice: 48 of 48); the full eval
# set passed 125 of 129 (96.9%; 95% Wilson lower bound 92%). With a safety
# margin, 0.70 fails a PR on noise alone 0.2% of the time at a true 90% and
# ~2% at 85% (binomial, 24 lines). It also catches a slide back to suggest-v1's
# length problem (v1 passed 54-67%, only max_words failing) 85% of the time,
# and any broken pipeline (empty lines, preambles, multi-line output).
name: Suggestion checks

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: eval-checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10 # 24 generations, no judge
    env:
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      MIN_PASS_RATE: ${{ vars.EVAL_MIN_CHECKS_PASS_RATE || '0.70' }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4 # version from package.json "packageManager"

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Validate the eval cases
        run: pnpm eval cases

      - name: Skip (no API key)
        if: env.GROQ_API_KEY == ''
        run: echo "::warning::GROQ_API_KEY is not available to this workflow (e.g. a pull request from a fork), so the suggestion checks were skipped."

      - name: Generate the smoke lines and run the deterministic checks
        if: env.GROQ_API_KEY != ''
        run: >
          pnpm eval checks --smoke --runs 3 --no-db
          --min-pass-rate "$MIN_PASS_RATE"
          --json "$GITHUB_WORKSPACE/eval-checks.json"
          --markdown "$GITHUB_STEP_SUMMARY"

      - name: Upload the lines
        if: always() && env.GROQ_API_KEY != ''
        uses: actions/upload-artifact@v4
        with:
          name: eval-checks
          path: eval-checks.json
          if-no-files-found: ignore
          retention-days: 30
