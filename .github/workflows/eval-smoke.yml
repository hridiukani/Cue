# The JUDGED smoke eval (packages/evals): quality of the smoke subset's lines,
# graded by the LLM judge. MANUAL ONLY (Actions → "Suggestion eval (smoke,
# judged)" → Run workflow), never on every pull request:
# - the judge (openai/gpt-oss-120b on Groq) has a 200,000 tokens-per-day limit
#   shared with local `pnpm eval` runs on the same key, and Groq counts each
#   call's full max-token budget against it. A judge on every PR would spend
#   that quota and fail at random with HTTP 429.
# Every PR instead runs the deterministic checks without a judge: eval-checks.yml.
#
# It uses the quota-friendly judge settings (low effort, 512 tokens, one call
# every 12 s): ~24 calls × ~1,200 tokens ≈ 29K tokens, about 15% of the daily
# limit. It fails if more than 5% of lines are left ungraded (the pass rate
# then can't be trusted) or if the pass rate is below the threshold.
#
# --max-wait 120: if local runs already spent the day's tokens, every judge
# call gets a ~7-minute tokens-per-day retry-after. Waiting them all out took
# ~2 hours locally (2026-11-20 smoke run: 22 such 429s), far past the job
# timeout. With 120 s the job instead stops grading at once and fails with
# "N of 24 ungraded … tokens per day": run it again later, or `pnpm eval
# rejudge` the uploaded results file locally.
#
# Needs the repository secret GROQ_API_KEY.
# Threshold: the "min_pass_rate" input, else the repository variable
# EVAL_MIN_PASS_RATE, else 0.04 (fail only if none of the 24 lines pass).
# Calibrated from a real smoke run of this exact command on the production
# prompt (suggest-v1, 2026-11-20): 26.1% (6 of 23 graded; 1 ungraded), in line
# with the saved runs (23-29%). At 26%, 0.04 false-alarms ~0.1% of the time and
# still catches a broken prompt or pipeline. suggest-v2 passed 46-62%: raise
# it to ~0.25 if production moves to v2.
name: Suggestion eval (smoke, judged)

on:
  workflow_dispatch:
    inputs:
      prompt_version:
        description: Prompt version to evaluate (empty = the production default)
        required: false
        default: ''
      runs:
        description: Generations per case
        required: false
        default: '3'
      min_pass_rate:
        description: Fail below this pass rate, 0-1 (empty = EVAL_MIN_PASS_RATE or 0.04)
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: eval-smoke # one judged run at a time: they share the judge's daily quota
  cancel-in-progress: false

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30 # 24 judge calls 12 s apart, plus per-minute waits (each up to 2 min)
    env:
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      MIN_PASS_RATE: ${{ inputs.min_pass_rate || vars.EVAL_MIN_PASS_RATE || '0.04' }}
      PROMPT_VERSION: ${{ inputs.prompt_version }}
      RUNS: ${{ inputs.runs || '3' }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4 # version from package.json "packageManager"

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Validate the eval cases
        run: pnpm eval cases

      - name: Fail (no API key)
        if: env.GROQ_API_KEY == ''
        run: |
          echo "::error::The repository secret GROQ_API_KEY is not set, so the judged eval can't run."
          exit 1

      - name: Run the judged smoke eval
        run: >
          pnpm eval --smoke --runs "$RUNS" --no-db
          ${PROMPT_VERSION:+--prompt-version "$PROMPT_VERSION"}
          --judge-effort low --judge-max-tokens 512 --judge-interval 12 --max-wait 120
          --min-pass-rate "$MIN_PASS_RATE"
          --json "$GITHUB_WORKSPACE/eval-smoke.json"
          --markdown "$GITHUB_STEP_SUMMARY"

      - name: Upload the eval results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-smoke
          path: |
            eval-smoke.json
            packages/evals/results/
          if-no-files-found: ignore
          retention-days: 30
